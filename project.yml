name: SpatialDecisionRouter
options:
  bundleIdPrefix: com.wsatz
targets:
  SpatialDecisionRouter:
    type: application
    platform: visionOS
    deploymentTarget: "27.0"
    sources: [SpatialDecisionRouter]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wsatz.SpatialDecisionRouter
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    info:
      path: SpatialDecisionRouter/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  SpatialDecisionRouterUITests:
    type: bundle.ui-testing
    platform: visionOS
    deploymentTarget: "27.0"
    sources: [UITests]
    dependencies:
      - target: SpatialDecisionRouter
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.wsatz.SpatialDecisionRouterUITests
        TEST_TARGET_NAME: SpatialDecisionRouter
        SWIFT_VERSION: "5.0"
        CODE_SIGN_IDENTITY: "-"
schemes:
  SpatialDecisionRouter:
    build:
      targets:
        SpatialDecisionRouter: all
    run:
      config: Debug
    test:
      targets: [SpatialDecisionRouterUITests]
