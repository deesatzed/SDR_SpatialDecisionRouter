name: SpatialDecisionRouter
options:
  bundleIdPrefix: com.wsatz
targets:
  SpatialDecisionRouter:
    type: application
    platform: visionOS
    deploymentTarget: "27.0"
    sources: [SpatialDecisionRouter]
    settings:
      base:
        PRODUCT_NAME: SpatialHITM
        PRODUCT_MODULE_NAME: SpatialDecisionRouter
        PRODUCT_BUNDLE_IDENTIFIER: com.wsatz.SpatialHITM
        INFOPLIST_KEY_CFBundleDisplayName: Spatial HITM
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    info:
      path: SpatialDecisionRouter/Info.plist
      properties:
        CFBundleDisplayName: Spatial HITM
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  SpatialDecisionRouterUITests:
    type: bundle.ui-testing
    platform: visionOS
    deploymentTarget: "27.0"
    sources: [UITests]
    dependencies:
      - target: SpatialDecisionRouter
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.wsatz.SpatialDecisionRouterUITests
        TEST_TARGET_NAME: SpatialDecisionRouter
        SWIFT_VERSION: "5.0"
        CODE_SIGN_IDENTITY: "-"
  SpatialDecisionRouterPad:
    # iPad (and Mac via "Designed for iPad"): same sources, flat 2D crossroads (SpatialDecisionRouter/Pad)
    type: application
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: SpatialDecisionRouter
        excludes: [Info.plist]
    settings:
      base:
        PRODUCT_NAME: SpatialHITM
        PRODUCT_MODULE_NAME: SpatialDecisionRouter
        PRODUCT_BUNDLE_IDENTIFIER: com.wsatz.SpatialHITM.pad
        INFOPLIST_KEY_CFBundleDisplayName: Spatial HITM
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    info:
      path: SupportFiles/Pad-Info.plist
      properties:
        CFBundleDisplayName: Spatial HITM
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  SpatialDecisionRouterPadUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "27.0"
    sources: [UITestsPad]
    dependencies:
      - target: SpatialDecisionRouterPad
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.wsatz.SpatialDecisionRouterPadUITests
        TEST_TARGET_NAME: SpatialDecisionRouterPad
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_IDENTITY: "-"
  SpatialDecisionRouterPadTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "27.0"
    sources: [UnitTests]
    dependencies:
      - target: SpatialDecisionRouterPad
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.wsatz.SpatialDecisionRouterPadTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SpatialHITM.app/SpatialHITM"
        BUNDLE_LOADER: "$(TEST_HOST)"
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_IDENTITY: "-"
schemes:
  SpatialHITM:
    build:
      targets:
        SpatialDecisionRouter: all
    run:
      config: Debug
    test:
      targets: [SpatialDecisionRouterUITests]
  SpatialDecisionRouterPad:
    build:
      targets:
        SpatialDecisionRouterPad: all
    run:
      config: Debug
    test:
      targets: [SpatialDecisionRouterPadTests, SpatialDecisionRouterPadUITests]
