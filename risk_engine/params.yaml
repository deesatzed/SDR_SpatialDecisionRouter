    value: 0.15
    source: placeholder
    citation: ''
    note: posterior P(risky) at/above which a negative report is not Reliable
  doubt_posterior_critical:
    value: 0.05
    source: placeholder
    citation: ''
    note: lower doubt threshold for truths that can cause a critical miss (stakes-aware reliability)
  critical_severity:
    value: 4
    source: placeholder
    citation: ''
    note: dx severity >= this counts as critical miss (integer 1-5)
  critical_escalate:
    value: 0.05
    source: placeholder
    citation: ''
    note: P(critical miss under sign-off) above which escalation is considered
  min_ruleout:
    value: 0.5
    source: placeholder
    citation: ''
    note: a question 'reduces it enough' if P(answer drives P(critical) below critical_escalate) >= this
